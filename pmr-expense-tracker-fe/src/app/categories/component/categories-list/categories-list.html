<header class="list-header">
  <h1>Categories</h1>
  <div class="flex-spacer"></div>
  <div class="filters"></div>
  <div class="header-actions">
    <button pButton (click)="onCreateClick()" (keydown.enter)="onCreateClick()">
      <span pButtonLabel>Create</span>
    </button>
  </div>
</header>
@if (categories().length) {
<p-table [value]="categories()">
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Code</th>
      <th>Name</th>
      <th>Parent</th>
      <th>Created At</th>
      <th>Updated At</th>
    </tr>
  </ng-template>
  <ng-template #body let-category>
    <tr>
      <td>{{ category.id }}</td>
      <td>{{ category.code }}</td>
      <td>{{ category.name }}</td>
      <td>{{ category.parentCategory?.name ?? "" }}</td>
      <td>{{ category.createdAt | date }}</td>
      <td>{{ category.updatedAt | date }}</td>
    </tr>
  </ng-template>
</p-table>
} @else {
<div class="no-results-found">
  <p>No categories found</p>
</div>
}
